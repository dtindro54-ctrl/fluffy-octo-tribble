services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school_local_password
      POSTGRES_DB: school_platform
    ports:
      - "5432:5432"
    volumes:
      - school_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school_postgres_data:
