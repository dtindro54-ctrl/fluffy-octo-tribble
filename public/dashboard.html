<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard Manajemen Sekolah & Komunitas</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f9;margin:0;padding:20px;color:#1f2937}.container{max-width:1000px;margin:0 auto}.card{background:#fff;padding:20px;border-radius:8px;box-shadow:0 1px 3px #0001;margin-bottom:20px}.hidden{display:none}input,select,button{padding:10px;margin:5px 0;border-radius:6px;border:1px solid #d1d5db}button{background:#2563eb;color:#fff;border:0;cursor:pointer;font-weight:600}button.btn-danger{background:#dc2626}button.btn-success{background:#16a34a}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}.alert{padding:10px;border-radius:6px;margin-bottom:15px;background:#fef3c7;color:#92400e}</style>
</head><body><div class="container"><div id="status-banner" class="alert hidden" role="status"></div>
<div id="login-section" class="card"><h2>Login Administrator / Staf</h2><form id="login-form"><input type="email" id="login-email" placeholder="Email" required><input type="password" id="login-password" placeholder="Kata Sandi" required><button type="submit">Masuk</button></form><p><a href="/pendaftaran-member-upload.html">Pendaftaran anggota</a> | <a href="/scanner-absensi.html">Scanner absensi</a></p></div>
<div id="app-section" class="hidden"><div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><h2 id="user-greeting">Selamat Datang</h2><small id="user-role-badge"></small></div><button id="logout-btn" class="btn-danger">Keluar</button></div>
<div class="card"><h3>Persetujuan Anggota Baru</h3><button id="refresh-pending-btn">Muat Ulang Daftar</button><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Aksi</th></tr></thead><tbody id="pending-tbody"></tbody></table></div>
<div class="card"><h3>Manajemen Keuangan</h3><p id="finance-summary-text">Memuat...</p><form id="finance-form"><select id="fin-type"><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select><input id="fin-category" type="text" placeholder="Kategori" required><input id="fin-amount" type="number" placeholder="Nominal (Rp)" min="1" required><input id="fin-desc" type="text" placeholder="Keterangan"><button type="submit">Simpan Transaksi</button></form><table><thead><tr><th>Tipe</th><th>Kategori</th><th>Keterangan</th><th>Nominal</th></tr></thead><tbody id="finance-tbody"></tbody></table></div></div></div>
<script src="/dashboard.js" defer></script></body></html>
