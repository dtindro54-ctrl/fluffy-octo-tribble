<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pendaftaran Anggota</title><style>body{font-family:system-ui,sans-serif;background:#f8fafc;padding:2rem;color:#1e293b}.box{max-width:700px;margin:auto;background:white;border:1px solid #ddd;border-radius:1rem;padding:2rem}label{display:block;margin:.7rem 0 .25rem}input,button{padding:.7rem;width:100%;box-sizing:border-box}button{margin-top:1rem;background:#2563eb;color:white;border:0;border-radius:.5rem}#status{padding:1rem;margin-top:1rem}</style></head>
<body><main class="box"><h1>Pendaftaran Anggota / Siswa</h1><p>Pendaftaran akan menunggu persetujuan Admin.</p>
<form id="register-form"><label>Nama lengkap</label><input name="full_name" required maxlength="150"><label>Email</label><input name="email" type="email" required><label>Nomor telepon</label><input name="phone" required><label>Password (minimal 8 karakter)</label><input name="password" type="password" minlength="8" required><label>Foto JPG/PNG (maks. 2MB)</label><input name="photo" type="file" accept="image/jpeg,image/png" required><label>Dokumen PDF (maks. 5MB)</label><input name="document" type="file" accept="application/pdf" required><button type="submit">Kirim pendaftaran</button></form><p id="status" role="status"></p></main><script src="/register.js" defer></script></body></html>
