<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Anggota</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 py-10 text-slate-800">
    <div class="mx-auto max-w-3xl rounded-2xl border bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold">Form Pendaftaran Anggota / Siswa</h1>
      <p class="mt-1 text-sm text-slate-500">Pendaftaran baru menunggu persetujuan admin.</p>

      <form id="register-form" class="mt-6 space-y-4">
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-sm font-medium">Nama Lengkap *</label>
            <input type="text" name="full_name" required class="w-full rounded border p-2" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium">Email *</label>
            <input type="email" name="email" required class="w-full rounded border p-2" />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-sm font-medium">Nomor HP *</label>
            <input type="tel" name="phone" required class="w-full rounded border p-2" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium">Password *</label>
            <input type="password" name="password" required minlength="8" class="w-full rounded border p-2" />
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="mb-1 block text-sm font-medium">Pas Foto (JPG/PNG)</label>
            <input type="file" name="photo" accept="image/png,image/jpeg" required class="w-full rounded border p-2" />
          </div>
          <div>
            <label class="mb-1 block text-sm font-medium">Dokumen Pendukung (PDF)</label>
            <input type="file" name="document" accept="application/pdf" required class="w-full rounded border p-2" />
          </div>
        </div>

        <button type="submit" class="w-full rounded bg-blue-600 px-4 py-2.5 text-white">
          Kirim Pendaftaran
        </button>
      </form>

      <div id="register-status" class="mt-4 hidden rounded border p-3 text-sm"></div>
    </div>

    <script>
      document.getElementById("register-form").addEventListener("submit", async (event) => {
        event.preventDefault();

        const form = event.currentTarget;
        const status = document.getElementById("register-status");
        const formData = new FormData(form);

        try {
          const response = await fetch("/api/members/register", {
            method: "POST",
            body: formData,
          });

          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Pendaftaran gagal");

          status.className = "mt-4 rounded border border-emerald-200 bg-emerald-50 p-3 text-sm text-emerald-700";
          status.textContent = `Pendaftaran berhasil dikirim. Status: ${result.status}.`;
          status.classList.remove("hidden");
          form.reset();
        } catch (error) {
          status.className = "mt-4 rounded border border-red-200 bg-red-50 p-3 text-sm text-red-700";
          status.textContent = error.message || "Terjadi kesalahan";
          status.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
