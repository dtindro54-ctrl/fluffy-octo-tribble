<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner Absensi</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 p-6">
    <div class="mx-auto max-w-xl rounded-2xl border bg-white p-6 shadow-sm">
      <h1 class="text-2xl font-bold">Scanner Absensi ID Card</h1>
      <p class="mt-1 text-sm text-slate-500">Pindai QR ID Card di sini.</p>

      <div class="mt-5">
        <div id="reader" class="mx-auto w-full max-w-md rounded border"></div>
      </div>

      <div class="mt-4">
        <label class="mb-1 block text-sm font-medium">Session ID</label>
        <input id="session-id" type="text" class="w-full rounded border p-2" placeholder="UUID session absensi" />
      </div>

      <div class="mt-4">
        <label class="mb-1 block text-sm font-medium">Aksi</label>
        <select id="action" class="w-full rounded border p-2">
          <option value="IN">Masuk</option>
          <option value="OUT">Pulang</option>
        </select>
      </div>

      <div class="mt-4">
        <label class="mb-1 block text-sm font-medium">Token Akses</label>
        <input id="token" type="text" class="w-full rounded border p-2" placeholder="Bearer token" />
      </div>

      <div id="scan-status" class="mt-4 hidden rounded border p-3 text-sm"></div>
    </div>

    <script>
      const status = document.getElementById("scan-status");
      const reader = new Html5Qrcode("reader");

      function setStatus(message, error = false) {
        status.textContent = message;
        status.className = "mt-4 rounded border p-3 text-sm";
        status.classList.remove("hidden");
        if (error) {
          status.classList.add("border-red-200", "bg-red-50", "text-red-700");
        } else {
          status.classList.add("border-emerald-200", "bg-emerald-50", "text-emerald-700");
        }
      }

      async function submitScan(cardCode) {
        const token = document.getElementById("token").value.trim();
        const sessionId = document.getElementById("session-id").value.trim();
        const action = document.getElementById("action").value;

        if (!token || !sessionId) {
          setStatus("Token akses dan Session ID wajib diisi.", true);
          return;
        }

        try {
          const response = await fetch("/api/attendance/scan", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ card_code: cardCode, session_id: sessionId, action }),
          });

          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Scan gagal");

          setStatus(`${result.data.name} (${result.data.member_no}) — ${result.data.action} berhasil: ${result.data.status}`);
        } catch (error) {
          setStatus(error.message || "Scan gagal", true);
        }
      }

      Html5Qrcode.getCameras().then((devices) => {
        if (!devices.length) {
          setStatus("Kamera tidak ditemukan.", true);
          return;
        }

        reader.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          (decodedText) => {
            setStatus("QR terdeteksi...");
            submitScan(decodedText);
          },
          () => {},
        ).catch(() => {
          setStatus("Kamera tidak dapat diakses.", true);
        });
      }).catch(() => {
        setStatus("Kamera tidak dapat dipanggil.", true);
      });
    </script>
  </body>
</html>
