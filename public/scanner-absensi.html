<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Scanner Absensi</title><style>body{font-family:system-ui,sans-serif;background:#f1f5f9;padding:1rem;color:#1e293b}.box{max-width:600px;margin:auto;background:white;padding:1.5rem;border-radius:1rem}input,select{box-sizing:border-box;width:100%;padding:.7rem;margin:.4rem 0 1rem}#scan-status{padding:.8rem}</style><script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js" defer></script><script src="/scanner.js" defer></script></head><body><main class="box"><h1>Scanner Absensi ID Card</h1><div id="reader"></div><label>Session ID</label><input id="session-id" placeholder="UUID sesi"><label>Token akses</label><input id="access-token" type="password" autocomplete="off"><label>Aksi</label><select id="action"><option value="IN">Masuk</option><option value="OUT">Pulang</option></select><p id="scan-status" role="status"></p></main></body></html>
