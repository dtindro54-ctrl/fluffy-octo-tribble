services:
  - type: web
    name: school-community-platform
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: school-platform-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_ORG_ID
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: school-platform-db
    plan: starter
